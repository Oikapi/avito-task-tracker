version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - ./backend/data:/app/data 
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./avito-task-tracker
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api 
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge